name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # There is no build step in this repo (bun runs .ts directly), so the
      # closest honest equivalent is checking that the entrypoint still starts.
      - name: Entrypoint smoke check
        run: ./bin/treehouse --help
