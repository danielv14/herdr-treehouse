id = "treehouse"
name = "Treehouse"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Worktree-as-tab workflow: bootstrap a git worktree per repo config and open it as a Herdr tab with a prepped dev pane."
platforms = ["macos", "linux"]

# Keybinding/UI entrypoint. Opens the interactive picker in a popup pane
# (an action runs headless, so prompting must happen in a plugin pane).
# `action up` reads the invocation context and opens that pane itself, so this
# is a call site for the engine like every other one.
[[actions]]
id = "up"
title = "Treehouse: new worktree tab"
contexts = ["workspace"]
command = ["bash", "bin/treehouse", "action", "up"]

[[panes]]
id = "up-interactive"
title = "Treehouse"
placement = "popup"
width = "70%"
height = 14
command = ["bash", "bin/treehouse", "up", "--interactive"]

# Keybinding/UI entrypoint for teardown: confirm-and-remove popup targeting
# the focused pane's worktree.
[[actions]]
id = "down"
title = "Treehouse: tear down this worktree tab"
contexts = ["workspace"]
command = ["bash", "bin/treehouse", "action", "down"]

[[panes]]
id = "down-interactive"
title = "Treehouse teardown"
placement = "popup"
width = "70%"
height = 14
command = ["bash", "bin/treehouse", "down", "--interactive"]

# Ctrl+click a Jira ticket or GitHub issue anywhere in a terminal: opens a
# worktree tab in the clicked pane's repo with a bare agent (no task prompt).
[[actions]]
id = "up-from-link"
title = "Treehouse: start from clicked link"
command = ["bash", "bin/treehouse", "up", "--from-link"]

[[link_handlers]]
id = "jira-ticket"
title = "Treehouse: start from Jira ticket"
pattern = "^https://[^./]+\\.atlassian\\.net/browse/[A-Z]+-[0-9]+/?$"
action = "up-from-link"

[[link_handlers]]
id = "github-issue"
title = "Treehouse: start from GitHub issue"
pattern = "^https://github\\.com/[^/]+/[^/]+/issues/[0-9]+/?$"
action = "up-from-link"

# When a worktree is created through Herdr's native flow, run the repo's
# bootstrap (env files, node_modules) if the repo is configured.
[[events]]
on = "worktree.created"
command = ["bash", "bin/treehouse", "bootstrap", "--from-event"]

# Keep the sidebar's $worktrees token fresh when Herdr's own worktree flow
# changes the count. treehouse up/down report the token themselves.
[[events]]
on = "worktree.created"
command = ["bash", "bin/treehouse", "report"]

[[events]]
on = "worktree.removed"
command = ["bash", "bin/treehouse", "report"]

# Herdr does not persist reported metadata across a server restart; re-report
# once the session is restored.
[[startup]]
command = ["bash", "bin/treehouse", "report"]
