# treehouse repo config. Lives at: $(herdr plugin config-dir treehouse)/config.toml
#
# Placeholders available in worktree_dir, bootstrap, setup, and pane commands:
#   {repo}        repo name (config key)
#   {branch}      full branch name, e.g. ABC-1234/fix-thing
#   {slug}        slugified branch, e.g. abc-1234-fix-thing
#   {ticket}      leading ticket id lowercased (abc-1234), empty if none
#   {id}          {ticket} if present, otherwise {slug}. Falls back to {slug}
#                 when another worktree of the same ticket already took the
#                 ticket, so two branches of one ticket stay apart (path, tab
#                 label and {id} all follow)
#   {worktree}    resolved worktree path
#   {root}        main checkout path
#   {base}        base ref (default origin/master); only used by the built-in
#                 worktree creation - a custom bootstrap owns its own base
#   {targets}     the --target list, comma-separated ("services/a, packages/b"),
#                 empty when none were given. Not for bootstrap argv - that
#                 takes the spread form below
#   {targets...}  expands to one argv entry per --target (bootstrap only, and
#                 only as an argv entry of its own)
#   {context_file} path of the rendered `context` file (agent command only)
#
# A single-word brace that is not one of these is an error, not a literal: a
# typo'd {wortkree} stops the run instead of reaching a shell command as text.
# Anything else in braces is left alone, because these values are shell commands:
# {{.Names}}, {.items[0]}, {print $1} and ${HOME} all pass through untouched.
#
# Unknown *keys* only warn, and a broken block in another repo never blocks this
# one. A wrong value type (setup = "npm ci", autostart = "false") stops the run,
# and a [repos.X] block must have a `root`.
#
# Worktree setup, two tiers:
#   setup     = ["corepack enable", "npm ci"]  # simple shell commands run inside a
#                                              # FRESHLY created worktree; enough for
#                                              # most repos: install deps,
#                                              # cp {root}/.env .env
#   bootstrap = ["path/to/script.sh", ...]     # replaces worktree creation entirely;
#                                              # for repos needing real logic (monorepos)
#
# Reopening a worktree that already exists skips setup: `treehouse up` on it just
# opens the tab. `treehouse up --setup` runs the setup commands there anyway, for
# a worktree that exists but was never provisioned (created by hand, by another
# tool, or before the repo had a treehouse config).
#
# A repo can override any of this with a .treehouse.toml in its root
# (same fields, no [repos.*] wrapper).

# Applies to every repo below. Any [repos.X] entry can override it, and
# `treehouse up --agent "..."` overrides both. Keep the keys inside this table:
# a bare `agent = "..."` line further down the file would attach to whichever
# [repos.X] block precedes it instead of applying globally.
[defaults]
# How the coding agent is started in the main pane. Omit it and treehouse runs
# a bare `claude`, which is usually what you want: the agent then picks up your
# own Claude Code settings, including permission mode. Set it here only for
# flags you want in every repo.
# agent = "claude --allow-dangerously-skip-permissions"
# Standing instructions for every repo's worktree agents, if you have any that
# are not repo-specific. A repo's own `context` REPLACES this rather than adding
# to it, like every other key.
# context = "You are in a git worktree: {worktree}, branch {branch}."

[repos.my-awesome-repo]
root = "~/dev/my-awesome-repo"
# Sibling layout: worktrees live next to the main checkout. This is also the
# default (`../{repo}-{id}`), so the line is only needed for a different layout.
# Relative paths resolve against the main checkout, not your cwd.
worktree_dir = "../my-awesome-repo-{id}"
base = "origin/master"
# The script handles env copying, config, and node_modules for the new worktree.
bootstrap = [
  "~/dev/my-awesome-repo/scripts/worktree-up.sh",
  "--dir", "{worktree}",
  "{branch}",
  "{targets...}",
]
# Standing instructions for the agent that starts in this repo's worktree tabs:
# the tab's situation, which no agent can see for itself. Rendered to a file
# outside the repo and read by {context_file} in the agent command below, which
# is the only place that placeholder works. Delivery is the system prompt, not a
# first message: standing context read as a task is worse than none, and a user
# message ages out on compaction. Set one without the other and `up` refuses.
context = """
You are in a git worktree of my-awesome-repo: {worktree}, branch {branch}, ticket {ticket}.
Bootstrapped targets: {targets}. Dependencies are installed only there.
Do not start the dev command. It is pre-filled in its own pane, and verification
is serial: two tabs must never race for the same containers and ports.
"""
agent = 'claude --append-system-prompt "$(cat {context_file})"'
# Panes: each entry splits the PREVIOUS pane (the first splits the main/agent
# pane). Layout below: agent | right column, right column halved.
# Verification is serial (tab by tab), so the dev command is only pre-filled;
# two tabs must never race for the same docker containers/ports.
[[repos.my-awesome-repo.panes]]
split = "right"
ratio = 0.5
label = "dev"
command = "npm run dev"
autostart = false

[[repos.my-awesome-repo.panes]]
split = "down"
ratio = 0.5
label = "shell"

# Minimal example: a repo where a plain worktree + deps + dev server is enough.
# [repos.side-project]
# root = "~/dev/side-project"
# setup = ["npm ci"]
# [[repos.side-project.panes]]
# split = "down"
# ratio = 0.3
# label = "dev"
# command = "npm run dev"
# autostart = false
